services:
  wechat-bridge:
    image: ghcr.io/yuuouu/wechat-bridge:latest
    container_name: wechat-bridge
    restart: unless-stopped
    ports:
      - "5200:5200"
    volumes:
      - ./data:/data
    environment:
      - PORT=5200
      - TOKEN_FILE=/data/token.json
      - DATA_DIR=/data
      - AI_CONFIG_FILE=/data/ai_config.json
      - MARKDOWN_MODE=
      - WEBHOOK_URL=
      - WEBHOOK_MODE=unknown_command
      - API_TOKEN=change-this-token
      - TZ=Asia/Shanghai
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
